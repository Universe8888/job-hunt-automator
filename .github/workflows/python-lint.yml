name: Python Lint and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Secret scan with Gitleaks
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest mypy pip-audit ruff
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Create config from template
      # config.py is git-ignored (holds personal search/gate settings); the test
      # suite imports it, so a clean CI checkout must materialise it from the
      # committed template — the same first step a new user takes.
      run: cp config.example.py config.py

    - name: Lint with Ruff
      run: |
        ruff check .

    - name: Advisory lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type check with mypy
      run: |
        mypy --ignore-missing-imports \
          gatekeeper.py cdp_session.py csv_export.py profile_matcher.py \
          scraper.py jobsbg_scraper.py main.py stealth_config.py

    - name: Audit dependencies
      run: |
        python -m pip_audit -r requirements.txt --progress-spinner off

    - name: Test with pytest
      run: |
        pytest tests/ -v
