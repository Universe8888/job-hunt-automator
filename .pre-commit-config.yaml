# Local hooks run against the active project environment.
# Setup: install project requirements plus pre-commit, ruff, mypy, pytest, and gitleaks.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-fatal
        name: ruff fatal syntax/name checks
        entry: python -m ruff check .
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: gitleaks-staged
        name: gitleaks staged scan
        entry: gitleaks git --staged --redact --no-banner
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: mypy-core
        name: mypy core modules
        entry: python -m mypy --ignore-missing-imports gatekeeper.py cdp_session.py csv_export.py profile_matcher.py scraper.py jobsbg_scraper.py main.py stealth_config.py
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pytest
        name: pytest
        entry: python tests/run_pytest_with_template_config.py
        language: system
        pass_filenames: false
        stages: [pre-push]
